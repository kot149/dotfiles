{{- /* chezmoi:modify-template */ -}}
{{- /* Configuration for oh-my-pi (omp) at ~/.omp/agent/config.yml. */ -}}
{{- /* Managed keys win, so omp-owned keys (setupVersion, modelRoles set via /model, and anything omp's setup flow rewrites) are NOT managed; they survive every apply. */ -}}
{{- $managed := `{
  "symbolPreset": "nerd",
  "composer": {
    "shape": "field"
  },
  "theme": {
    "dark": "anthracite"
  }
}` -}}
{{ includeTemplate "agents/merge-config.tmpl" (dict "current" .chezmoi.stdin "managed" $managed "format" "yaml") -}}
