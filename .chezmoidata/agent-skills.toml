# Orca ADE (https://www.onorca.dev). Orca scans ~/.claude/skills,
# ~/.agents/skills and ~/.codex/skills itself, so the two stores above are
# enough. `jira-tickets` / `linear-tickets` are the legacy names of `orca-jira`
# / `orca-linear` and ship only to let existing installs converge, so they stay
# out; a fresh install is not one of them. The `orca-emulator*` skills drive a
# mobile device/simulator and are left out too.
[[agent_skills]]
repo = "stablyai/orca"
rev = "ae09815770c1d6c8b83a35f99c0021d35273608a"
prefix = "skills"
names = [
  "computer-use",
  "orca-cli",
  "orca-jira",
  "orca-linear",
  "orca-per-workspace-env",
  "orchestration",
]
agents = ["claude", "agents"]
