[tasks.setup]
description = "First-run setup: write machine-specific mise.local.toml"
run = "sh scripts/setup.sh"
run_windows = "pwsh -NoProfile -File scripts/setup.ps1"

[tasks.migrate-from-chezmoi]
description = "Adopt existing regular files into mise management (backup, apply, drop identical)"
run = "python3 scripts/migrate-dotfiles.py"
run_windows = "pwsh -NoProfile -File scripts/migrate-dotfiles.ps1"

[tasks.generate-agent-files]
description = "Regenerate generated/ from config/*.toml"
run = "python3 scripts/generate-agent-files.py"
sources = [
  "config/agent-permissions.toml",
  "config/nix-binary-caches.toml",
  "scripts/generate-agent-files.py",
  "templates/claude/settings.json.skel",
  "templates/opencode/opencode.json.skel",
  "templates/antigravity/settings.json.skel",
]

[tasks.check-generated]
description = "Fail if generated/ is stale (run generate-agent-files to refresh)"
run = "python3 scripts/generate-agent-files.py --check"
# No sources: the check compares generated/ outputs against their inputs, so
# it must run every time. With sources, editing only generated/ files would
# be skipped and reported as success.

[tasks.sync-agent-skills]
description = "Sync pinned third-party agent skills into ~/.agents/skills and ~/.claude/skills"
run = "bun scripts/sync-agent-skills.ts"
# No sources: skill outputs live outside [dotfiles], so deletion/drift is
# invisible to dotfiles status and to the sync task's own freshness marker.
# The script syncs missing skills and changed pins.

[tasks.check-agent-skills]
description = "Fail if any pinned third-party skill is missing or outdated"
depends = ["sync-agent-skills"]
run = "bun scripts/sync-agent-skills.ts --check"
# No sources: skill outputs live outside [dotfiles], so deletion/drift is
# invisible to dotfiles status and to the sync task's own freshness marker.
# This check verifies SKILL.md and the installed pin on every bootstrap.

[tasks.refresh-externals]
description = "Update git-repo externals and re-download pinned skills (replaces refreshPeriod)"
run = "mise bootstrap repos update && bun scripts/sync-agent-skills.ts --refresh"
run_windows = "mise bootstrap repos update; bun scripts/sync-agent-skills.ts --refresh"

[tasks.apply-codex-config]
description = "Merge managed settings into ~/.codex/config.toml"
run = "sh scripts/apply-codex-config.sh"
run_windows = "pwsh -NoProfile -File scripts/apply-codex-config.ps1"
sources = [
  "templates/codex/config.toml",
  "scripts/apply-codex-config.sh",
  "scripts/apply-codex-config.ps1",
  "scripts/merge-codex-config.py",
]

[tasks.apply-antigravity-config]
description = "Merge managed permissions into the Antigravity CLI settings.json"
run = "sh scripts/apply-antigravity-config.sh"
run_windows = "pwsh -NoProfile -File scripts/apply-antigravity-config.ps1"
sources = [
  "generated/antigravity-settings.json",
  "scripts/apply-antigravity-config.sh",
  "scripts/apply-antigravity-config.ps1",
]

[tasks.apply-vscode-settings]
description = "Merge managed settings into Code/Cursor settings.json"
run = "sh scripts/apply-vscode-settings.sh"
run_windows = "pwsh -NoProfile -File scripts/apply-vscode-settings.ps1"
sources = [
  "templates/vscode/settings.json",
  "scripts/apply-vscode-settings.sh",
  "scripts/apply-vscode-settings.ps1",
  "scripts/merge-vscode-settings.py",
]

[tasks.apply-vscode-keybindings]
description = "Merge managed keybindings into Code/Cursor keybindings.json"
run = "sh scripts/apply-vscode-keybindings.sh"
run_windows = "pwsh -NoProfile -File scripts/apply-vscode-keybindings.ps1"
sources = [
  "templates/vscode/keybindings.json",
  "scripts/apply-vscode-keybindings.sh",
  "scripts/apply-vscode-keybindings.ps1",
  "scripts/merge-vscode-keybindings.py",
]

[tasks.apply-home-manager]
description = "Home Manager switch (skips on Windows; after nix-custom-conf)"
depends = ["apply-nix-custom-conf", "generate-agent-files"]
run = "sh scripts/apply-home-manager.sh"
run_windows = "echo 'Skipped on Windows (unix-only task)'"
sources = [
  "mise.toml",
  "mise.local.toml",
  "templates/home-manager/flake.nix.tera",
  "templates/home-manager/common.nix.tera",
  "dotfiles/.config/home-manager/linux-common.nix",
  "dotfiles/.config/home-manager/linux-desktop.nix",
  "dotfiles/.config/home-manager/linux-headless.nix",
  "dotfiles/.config/home-manager/darwin.nix",
  "dotfiles/.config/home-manager/wsl.nix",
  "dotfiles/.config/home-manager/pkgs/cli-proxy-api.nix",
  "dotfiles/.config/home-manager/pkgs/terminal-browser.nix",
  "dotfiles/.config/home-manager/pkgs/tode.nix",
  "dotfiles/.config/home-manager/pkgs/tode-launcher.sh",
  "scripts/apply-home-manager.sh",
  "config/nix-binary-caches.toml",
]

[tasks.apply-nix-custom-conf]
description = "Converge /etc/nix/nix.custom.conf (skips on Windows; after nix-linux-conf)"
depends = ["apply-nix-linux-conf"]
run = "sh scripts/apply-nix-custom-conf.sh"
run_windows = "echo 'Skipped on Windows (unix-only task)'"
sources = ["scripts/apply-nix-custom-conf.sh", "config/nix-binary-caches.toml"]

[tasks.apply-nix-darwin]
description = "nix-darwin switch (macOS only, skips elsewhere; after home-manager)"
depends = ["apply-home-manager"]
run = "sh scripts/apply-nix-darwin.sh"
run_windows = "echo 'Skipped on Windows (macOS-only task)'"
sources = [
  "templates/nix-darwin/flake.nix.tera",
  "templates/nix-darwin/darwin-configuration.nix.tera",
  "scripts/apply-nix-darwin.sh",
]

[tasks.apply-nix-linux-conf]
description = "Tune /etc/nix/nix.conf (Linux only, skips elsewhere)"
run = "sh scripts/apply-nix-linux-conf.sh"
run_windows = "echo 'Skipped on Windows (Linux-only task)'"
sources = ["scripts/apply-nix-linux-conf.sh"]

[tasks.apply-karabiner-goku]
description = "Regenerate karabiner.json from karabiner.edn (macOS only; after nix-custom-conf)"
depends = ["apply-nix-custom-conf"]
run = "sh scripts/apply-karabiner-goku.sh"
run_windows = "echo 'Skipped on Windows (macOS-only task)'"
sources = ["dotfiles/.config/karabiner.edn", "scripts/apply-karabiner-goku.sh"]

[tasks.apply-tailscaled-launchd]
description = "Install/teardown tailscaled LaunchDaemon (macOS only; after home-manager)"
depends = ["apply-home-manager"]
run = "sh scripts/apply-tailscaled-launchd.sh"
run_windows = "echo 'Skipped on Windows (macOS-only task)'"
# Check the installed binary on every run, including after Home Manager updates.
sources = [
  "scripts/apply-tailscaled-launchd.sh",
  "scripts/macos-launchd/tailscaled.sh",
]

[tasks.import-rectangle]
description = "Import Rectangle settings via defaults (macOS only)"
run = "sh scripts/import-rectangle.sh"
run_windows = "echo 'Skipped on Windows (macOS-only task)'"
sources = ["templates/macos/rectangle.plist", "scripts/import-rectangle.sh"]

[tasks.import-dockdoor]
description = "Import DockDoor settings via defaults (macOS only)"
run = "sh scripts/import-dockdoor.sh"
run_windows = "echo 'Skipped on Windows (macOS-only task)'"
sources = ["templates/macos/dockdoor.plist", "scripts/import-dockdoor.sh"]

[tasks.configure-alttab]
description = "Set AltTab previous-window shortcut (macOS only)"
run = "sh scripts/configure-alttab.sh"
run_windows = "echo 'Skipped on Windows (macOS-only task)'"
sources = ["scripts/configure-alttab.sh"]

[tasks.apply-herdr-plugins]
description = "Link herdr plugins and reload config (skips on Windows/without herdr; after home-manager)"
depends = ["apply-home-manager"]
run = "sh scripts/apply-herdr-plugins.sh"
run_windows = "echo 'Skipped on Windows (unix-only task)'"
sources = [
  "dotfiles/.local/share/herdr-plugins/copy-output-py/herdr-plugin.toml",
  "dotfiles/.local/share/herdr-plugins/copy-output-py/copy_output.py",
  "dotfiles/.local/share/herdr-plugins/next-agent-py/herdr-plugin.toml",
  "dotfiles/.local/share/herdr-plugins/next-agent-py/next_agent.py",
  "dotfiles/.config/herdr/plugins/config/local.copy-output/config.toml",
  "dotfiles/.config/herdr/plugins/config/local.next-agent/config.toml",
  "scripts/apply-herdr-plugins.sh",
]

[tasks.bootstrap]
description = "Full converge: every apply task that is not covered by declarative bootstrap steps"
depends = [
  "generate-agent-files",
  "sync-agent-skills",
  "check-agent-skills",
  "apply-codex-config",
  "apply-antigravity-config",
  "apply-vscode-settings",
  "apply-vscode-keybindings",
  "apply-home-manager",
  "apply-nix-custom-conf",
  "apply-nix-darwin",
  "apply-nix-linux-conf",
  "apply-karabiner-goku",
  "apply-tailscaled-launchd",
  "import-rectangle",
  "import-dockdoor",
  "configure-alttab",
  "apply-herdr-plugins",
]
