id = "local.next-agent"
name = "Next Agent"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Move between Agents in configured semantic states"
platforms = ["linux", "macos"]

[[actions]]
id = "next"
title = "Focus next matching Agent"
contexts = ["pane", "workspace"]
command = ["uv", "run", "--script", "next_agent.py", "next"]

[[actions]]
id = "previous"
title = "Focus previous matching Agent"
contexts = ["pane", "workspace"]
command = ["uv", "run", "--script", "next_agent.py", "previous"]
