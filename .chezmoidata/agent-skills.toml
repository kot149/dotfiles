# Third-party agent skills, materialized by .chezmoiexternal.toml.tmpl as archive
# externals (works on every OS, Windows included -- no symlinks, no Nix).
#
#   repo    GitHub owner/name
#   rev     commit SHA to pin (bump with scripts/update_agent_skills.py)
#   prefix  directory inside the repo that holds the skills
#   names   skill directory names under prefix
#   agents  which config dirs receive them (~/.<agent>/skills/<name>); one
#           declaration feeds every listed store, so a skill needed everywhere
#           lists both "agents" (the shared ~/.agents/skills store that Codex and
#           most other agents read natively) and "claude" (~/.claude/skills, the
#           only place Claude Code looks)
#
# Self-authored skills are not listed here; they are checked into dot_claude/skills
# and dot_agents/skills (shared bodies live in .chezmoitemplates/agents/skills).

[[agent_skills]]
repo = "yusukebe/ax"
rev = "8abbca2fc400c2ff4866248ba1ec9309b948812f"
prefix = "skills"
names = ["ax"]
agents = ["claude", "agents"]

