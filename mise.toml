# Dotfiles repo root. OS-specific layers (mise.unix.toml, mise.{macos,linux,windows}.toml)
# load automatically via auto_env in .miserc.toml (early-init setting).
# Machine overrides live in gitignored mise.local.toml (`mise run setup`).
# Explicit MISE_ENV / `-E` still works and takes precedence over the platform layers.

[vars]
git_user_name = "kot149"
git_user_email = "131101078+kot149@users.noreply.github.com"
git_signing_key = ""
git_allowed_signers = ""
git_editor = "code --wait"
git_commit_gpgsign = "true"
git_safe_directories = ""
linux_gui = ""

